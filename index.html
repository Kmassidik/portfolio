    <!-- Structured Data (JSON-LD for SEO) -->

        "name": "Kurnia Massidik",
        "url": "https://kurniatech.my.id",

    <!-- Robots -->
    <meta
      name="robots"
      content="index, follow, max-snippet:-1, max-image-preview:large"
    />

    <!-- Theme color -->
    <meta name="theme-color" content="#0f172a" />

    <!-- Apply the saved/OS theme before first paint — no flash of wrong theme
         on the prerendered markup. -->
    <script>
      (function () {
        try {
          var s = localStorage.getItem("darkMode");
          var dark =
            s !== null
              ? JSON.parse(s)
              : window.matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.dataset.theme = dark ? "dark" : "light";
        } catch (e) {}
      })();
    </script>

    <!-- Preload fonts or critical assets if needed -->
